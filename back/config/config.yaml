server:
  port: 8080
  mode: debug

database:
  host: localhost
  port: 5432
  user: postgres
  password: password
  dbname: edu_classroom
  sslmode: disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 300

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

coze:
  api_key: ""
  api_base_url: "https://api.coze.cn/v3"
  timeout: 5
  retry_count: 2

tts:
  api_key: ""
  api_base_url: ""
  timeout: 3
  retry_count: 1

storage:
  provider: local
  local_path: ./uploads
  oss_endpoint: ""
  oss_access_key_id: ""
  oss_access_key_secret: ""
  oss_bucket: ""
  cos_secret_id: ""
  cos_secret_key: ""
  cos_region: ""
  cos_bucket: ""

cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://localhost:8080"

rate_limit:
  requests_per_second: 10
  burst: 20

logging:
  level: debug
  output_path: ./logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30
